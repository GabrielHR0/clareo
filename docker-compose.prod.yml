version: "3.8"

# Docker Compose para desenvolvimento local simulando produção DOKS
# Usa Cassandra com autenticação (como Bitnami Helm) e mesmo fluxo de init

services:
  cassandra:
    image: bitnami/cassandra:4.1
    environment:
      - CASSANDRA_CLUSTER_NAME=clareo
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_SEEDS=cassandra
      - CASSANDRA_PASSWORD=senha_secreta_cassandra
      - CASSANDRA_USERNAME=admin
      - CASSANDRA_ENABLE_USER_DEFINED_FUNCTIONS=true
    volumes:
      - cassandra-data:/bitnami/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD", "bash", "-lc", "cqlsh -u admin -p senha_secreta_cassandra -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rails:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /rails
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      BUNDLE_PATH: /usr/local/bundle
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: clareo
      CASSANDRA_USERNAME: admin
      CASSANDRA_PASSWORD: senha_secreta_cassandra
      CASSANDRA_DC: datacenter1
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    command: >
      bash -lc "ruby -rsocket -e \"loop do; begin; TCPSocket.new('redis', 6379).close; break; rescue; sleep 1; end; end\" \
      && bundle install \
      && rm -f tmp/pids/server.pid \
      && bin/rails cassandra:migrate \
      && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /rails
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      BUNDLE_PATH: /usr/local/bundle
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: clareo
      CASSANDRA_USERNAME: admin
      CASSANDRA_PASSWORD: senha_secreta_cassandra
      CASSANDRA_DC: datacenter1
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    command: >
      bash -lc "ruby -rsocket -e \"loop do; begin; TCPSocket.new('redis', 6379).close; break; rescue; sleep 1; end; end\" \
      && bundle exec sidekiq"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - rails
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  cassandra-data:
  redis-data:
  bundle: