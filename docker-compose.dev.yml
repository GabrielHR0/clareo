services:
  rails:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /rails
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      BUNDLE_PATH: /usr/local/bundle
      CASSANDRA_CONTACT_POINTS: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    command: >
      bash -lc "ruby -rsocket -e \"loop do; begin; TCPSocket.new('redis', 6379).close; break; rescue; sleep 1; end; end\" \
      && bundle install \
      && rm -f tmp/pids/server.pid \
      && bin/rails server -b 0.0.0.0 -p 3000"
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  bundle:
