apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cassandra-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: cassandra
  endpoints:
  - port: jmx-exporter
    interval: 30s
    path: /metrics
  namespaceSelector:
    matchNames:
    - default