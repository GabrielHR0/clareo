apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rails
  template:
    metadata:
      labels:
        app: rails
    spec:
      imagePullSecrets:
        - name: do-registry
      initContainers:
        - name: wait-for-cassandra
          image: docker.io/library/ruby:3.2-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Aguardando Cassandra em ${CASSANDRA_CONTACT_POINTS}:${CASSANDRA_PORT}..."
              for i in $(seq 1 60); do
                if ruby -rsocket -e "TCPSocket.new(ENV['CASSANDRA_CONTACT_POINTS'], ENV['CASSANDRA_PORT'].to_i).close" 2>/dev/null; then
                  echo "Cassandra está acessível!"
                  exit 0
                fi
                echo "Tentativa $i/60 - aguardando 2s..."
                sleep 2
              done
              echo "Timeout aguardando Cassandra"
              exit 1
          env:
            - name: CASSANDRA_CONTACT_POINTS
              value: "meu-cassandra"
            - name: CASSANDRA_PORT
              value: "9042"
      containers:
        - name: rails
          image: registry.digitalocean.com/clareo-registry/clareo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: RAILS_ENV
              value: "production"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rails-secret
                  key: SECRET_KEY_BASE
            - name: CASSANDRA_CONTACT_POINTS
              value: "meu-cassandra"
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_KEYSPACE
              value: "clareo"
            - name: CASSANDRA_USERNAME
              value: "admin"
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cassandra-auth
                  key: password
            - name: CASSANDRA_DC
              value: "datacenter1"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: rails
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: rails

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rails-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rails
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
